<div class="modal" id="employee-modal">
  <form>
    <label>Name: <input type="text" name="name" required></label>
    <label>Role: <input type="text" name="role" required></label>
    <fieldset>
      <legend>Proficiency:</legend>
      <label><input type="radio" name="proficiency" value="Beginner" required> Beginner</label>
      <label><input type="radio" name="proficiency" value="Intermediate"> Intermediate</label>
      <label><input type="radio" name="proficiency" value="Advanced"> Advanced</label>
    </fieldset>
    <label>Skills: <input type="text" name="skills" placeholder="Comma separated skills" required></label>
    <button type="submit">Save</button>
    <button type="button" id="close-modal">Cancel</button>
  </form>
</div>
